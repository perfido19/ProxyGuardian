name: local/fleet-custom-whitelist
description: "Whitelist IP di servizi terze parti noti e legittimi (replica dell'eccezione gia' approvata su main, gestita da dashboard CrowdSec > Whitelist)"
whitelist:
  reason: "ss-iptv.com / servizi terze parti legittimi - vedi project_crowdsec_whitelist_tainted_fix_2026-08-24 e project_cloudflare_asn_main_fix_2026-08-23"
  ip:
    - "116.202.118.184"
  cidr:
    - "51.161.128.0/17"  # IPTV Smarters (servizio terze parti legittimo, whitelist fleet 2026-08-21)
    - "51.15.0.0/16"     # Scaleway - richiesta utente 2026-08-23
    - "51.254.0.0/15"    # Scaleway - richiesta utente 2026-08-23
    - "51.255.0.0/15"    # Scaleway - richiesta utente 2026-08-23
    - "104.28.0.0/14"     # Cloudflare AS13335 - evita falsi ban CrowdSec su IP edge legittimi
  expression:
    # 403/404 su URL riproduzione contenuti XtreamCodes (/tipo/user/pass/streamid[.ext]) = problema
    # entitlement/geo/VOD rotto lato pannello, NON path scanning. I probe veri non hanno user/pass
    # validi nel path. Evita FP su crowdsecurity/http-probing, local/iptv-404-probe,
    # crowdsecurity/http-crawl-non_statics. Indagine 2026-09-02: categoria VOD 468 non autorizzata
    # ma visibile ai player -> raffiche di 403 su /movie/<user>/<pass>/<id>.mkv da clienti reali.
    - "evt.Meta.log_type == 'http_access-log' && evt.Parsed.status in ['403','404'] && evt.Parsed.request matches '^/+(movie|series|live|hls|hlsr|timeshift)/[^/]+/[^/]+/'"
    - "evt.Meta.log_type == 'http_access-log' && evt.Parsed.status in ['403','404'] && evt.Parsed.request matches '^/+[^/.]+/[^/.]+/[0-9]+([.][a-z0-9]{2,4})?([?].*)?$'"
