type: leaky
name: local/http-404-scanner

description: "Detect directory and vulnerability scanners"

filter: >
  evt.Meta.log_type == 'http_access-log'
  &&
  evt.Parsed.status == '404'
  &&
  (
      evt.Parsed.request contains "/.env"
      ||
      evt.Parsed.request contains "/.git"
      ||
      evt.Parsed.request contains "/.svn"
      ||
      evt.Parsed.request contains "/.hg"
      ||
      evt.Parsed.request contains "/phpmyadmin"
      ||
      evt.Parsed.request contains "/pma"
      ||
      evt.Parsed.request contains "/wp-admin"
      ||
      evt.Parsed.request contains "/wp-login.php"
      ||
      evt.Parsed.request contains "/xmlrpc.php"
      ||
      evt.Parsed.request contains "/cgi-bin/"
      ||
      evt.Parsed.request contains "/vendor/"
      ||
      evt.Parsed.request contains "/server-status"
      ||
      evt.Parsed.request contains "/server-info"
      ||
      evt.Parsed.request contains "/actuator"
      ||
      evt.Parsed.request contains "/manager/html"
      ||
      evt.Parsed.request contains "/jenkins"
      ||
      evt.Parsed.request contains "/boaform"
      ||
      evt.Parsed.request contains "/shell"
      ||
      evt.Parsed.request contains "/debug"
      ||
      evt.Parsed.request contains "/console"
      ||
      evt.Parsed.request contains "/autodiscover"
      ||
      evt.Parsed.request contains "/owa"
      ||
      evt.Parsed.request contains "/ecp"
      ||
      evt.Parsed.request contains "/webui"
      ||
      evt.Parsed.request contains ".sql"
      ||
      evt.Parsed.request contains ".bak"
      ||
      evt.Parsed.request contains ".old"
      ||
      evt.Parsed.request contains ".zip"
      ||
      evt.Parsed.request contains ".tar"
      ||
      evt.Parsed.request contains ".tar.gz"
      ||
      evt.Parsed.request contains ".rar"
      ||
      evt.Parsed.request contains ".7z"
      ||
      evt.Parsed.request contains "config.php"
      ||
      evt.Parsed.request contains "backup"
  )

groupby: evt.Parsed.remote_addr

capacity: 5
leakspeed: 10m
blackhole: 1h

labels:
  service: http
  type: scan
  remediation: true