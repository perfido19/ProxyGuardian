type: leaky
name: local/iptv-player-api-flood
description: "IP makes excessive player_api.php or get.php requests — M3U scraper or multi-account credential sharing (excluding normal stream list loading)"

filter: >
  evt.Meta.log_type == 'http_access-log'
  &&
  (
    evt.Parsed.request contains 'player_api.php'
    ||
    evt.Parsed.request contains '/get.php'
  )
  &&
  !(
    evt.Parsed.request contains 'action=get_live_streams'
    ||
    evt.Parsed.request contains 'action=get_vod_streams'
    ||
    evt.Parsed.request contains 'action=get_series'
    ||
    evt.Parsed.request contains 'action=get_short_epg'
    ||
    evt.Parsed.request contains 'get_simple_data_table'
    ||
    evt.Parsed.request contains 'HTTP/1.1" 302 0'
    ||
    evt.Parsed.request contains 'action=get_live_categories'
    ||
    evt.Parsed.request contains 'action=get_vod_categories'
    ||
    evt.Parsed.request contains 'action=get_series_categories'
  )

groupby: evt.Parsed.remote_addr

capacity: 60
leakspeed: 5s
blackhole: 10m

labels:
  service: http
  type: flooding
  remediation: true
