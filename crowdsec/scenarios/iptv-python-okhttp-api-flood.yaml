type: leaky
name: local/iptv-python-okhttp-api-flood
description: "Rileva burst di richieste API IPTV con User-Agent okhttp, escludendo il normale caricamento delle liste."

filter: >
  evt.Meta.log_type == 'http_access-log'
  &&
  (
    evt.Parsed.request contains 'player_api.php'
    ||
    evt.Parsed.request contains 'get.php'
  )
  &&
  evt.Parsed.http_user_agent contains 'okhttp'
  &&
  !(
    evt.Meta.http_path contains 'action=get_live_streams'
    ||
    evt.Meta.http_path contains 'action=get_vod_streams'
    ||
    evt.Meta.http_path contains 'action=get_series'
    ||
    evt.Meta.http_path contains 'action=get_short_epg'
    ||
    evt.Meta.http_path contains 'get_simple_data_table'
    ||
    evt.Parsed.status == '302'
    ||
    evt.Meta.http_path contains 'action=get_live_categories'
    ||
    evt.Meta.http_path contains 'action=get_vod_categories'
    ||
    evt.Meta.http_path contains 'action=get_series_categories'
  )

groupby: evt.Parsed.remote_addr

capacity: 20
leakspeed: 30s
blackhole: 30m

labels:
  service: http
  type: scraping
  remediation: true
