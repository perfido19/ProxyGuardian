type: leaky
name: local/iptv-get-php-bulk-download
description: "Scraping M3U: /get.php chiamato troppo spesso (scarica lista canali completa a loop). capacity/leakspeed alzati per svuotare il bucket tra sessioni separate (es. mattina/pomeriggio) senza sommare richieste passate."
filter: "evt.Meta.log_type == 'http_access-log' and evt.Parsed.request contains 'get.php' and evt.Parsed.status == '200'"
groupby: "evt.Parsed.remote_addr"
capacity: 15
leakspeed: "10m"
blackhole: "2h"
labels:
  service: http
  type: scraping
  remediation: true
