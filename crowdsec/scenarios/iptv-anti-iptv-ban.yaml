type: trigger
name: local/anti-iptv-credential-sharing
description: "Anti-IPTV detected credential sharing (same IP used more distinct usernames than the configured MAX_USERNAME threshold in the 6h window)"
filter: "evt.Meta.log_type == 'anti_iptv_ban'"
groupby: "evt.Meta.source_ip"
labels:
  service: iptv
  type: credential_sharing
  remediation: true
