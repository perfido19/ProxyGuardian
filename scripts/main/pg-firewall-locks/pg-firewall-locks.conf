# /etc/pg-firewall/locks.conf
# Allowlist firewall di main per porte sensibili. Applicato da
# /usr/local/sbin/pg-firewall-locks.sh (boot + timer 5min, auto-heal).
#
# Formati:
#   keep <args iptables>                  -> rule letterale sempre presente,
#                                            inserita PRIMA di CROWDSEC_CHAIN
#   <porta> <iface|src> <valore>          -> ACCEPT nel blocco della porta,
#                                            inserito DOPO CROWDSEC_CHAIN
#     iface  -> ACCEPT su quell'interfaccia in ingresso
#     src    -> ACCEPT da quel CIDR/IP
# Terminator per porta (hardcoded nello script):
#   8880 -> DROP (silenzioso)
#   7999 -> REJECT --reject-with tcp-reset
#
# AGGIUNGERE UN NODO: aggiungi la riga qui, poi
#   /usr/local/sbin/pg-firewall-locks.sh
# (oppure aspetta max 5 min il timer)

# ---- mesh NetBird / regole critiche (keep, prima di CROWDSEC_CHAIN) ----
keep -p udp -m udp --dport 51820 -j ACCEPT
keep -i wt0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

# ---- :8880 streaming XtreamCodes ----
8880 iface lo
8880 iface wt0
# Cloudflare v4 (cloudflare.com/ips-v4)
8880 src 173.245.48.0/20
8880 src 103.21.244.0/22
8880 src 103.22.200.0/22
8880 src 103.31.4.0/22
8880 src 141.101.64.0/18
8880 src 108.162.192.0/18
8880 src 190.93.240.0/20
8880 src 188.114.96.0/20
8880 src 197.234.240.0/22
8880 src 198.41.128.0/17
8880 src 162.158.0.0/15
8880 src 104.16.0.0/13
8880 src 104.24.0.0/14
8880 src 172.64.0.0/13
8880 src 131.0.72.0/22
# egress Worker CF non nella lista ufficiale
8880 src 104.28.0.0/14

# ---- :7999 MariaDB XtreamCodes ----
7999 src 127.0.0.1/32
7999 src 94.249.153.32/32
7999 src 205.237.105.147/32
7999 src 93.113.203.120/32
7999 src 45.86.190.0/23
